<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tvman - Hub</title>
    
    <!-- Website Tab Icon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Background Audio Element -->
    <audio id="bg-audio" loop>
        <source src="Cynical.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Music Player Widget -->
    <div id="music-toggle-btn" class="music-widget" title="Play/Pause Music">
        <div class="music-thumb-container">
            <img src="IMG_8648.jpeg" alt="Song Icon" class="music-thumb">
            <div class="play-overlay">
                <i id="music-icon" class="fa-solid fa-play"></i>
            </div>
        </div>
        <div class="music-info">
            <span class="song-name">Cynical</span>
            <span class="artist-name">by Kaeray</span>
        </div>
    </div>

    <!-- Background Animation Container -->
    <div class="bg-animation">
        <div class="red-glow"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Profile Section -->
        <div class="profile-section">
            <div class="pfp-container">
                <img src="CDEE8C6A-3BF4-47AE-9D9D-9912377216A7.webp" alt="Tvman PFP" class="pfp">
            </div>
            <h1 class="profile-name">Tvman</h1>
            <div class="profile-handle">
                <i class="fa-brands fa-discord"></i>
                <span>@tvmangt</span>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="tabs-container">
            <button class="tab-btn" data-link="discord">Modded Apks <span class="tag free">Free/Get By Discord</span></button>
            <button class="tab-btn" data-link="discord">Discord</button>
            <button class="tab-btn" data-link="github">TvMenu Lib <span class="tag free">FREE</span></button>
            <button class="tab-btn" data-link="discord">TvMenuPCVR <span class="tag paid">Paid/Buy at discord</span></button>
            <button class="tab-btn" data-link="discord">Modded Gtag By Tvman <span class="tag paid">Paid/Buy at discord</span></button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
