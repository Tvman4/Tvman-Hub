<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tvman - Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for the Discord icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Background Animation Container -->
    <div class="bg-animation">
        <div class="red-glow"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Profile Section -->
        <div class="profile-section">
            <div class="pfp-container">
                <img src="CDEE8C6A-3BF4-47AE-9D9D-9912377216A7.webp" alt="Tvman PFP" class="pfp">
            </div>
            <h1 class="profile-name">Tvman</h1>
            <div class="profile-handle">
                <i class="fa-brands fa-discord"></i>
                <span>@tvmangt</span>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="tabs-container">
            <button class="tab-btn" data-target="modded-apks">Modded Apks <span class="tag free">FREE</span></button>
            <button class="tab-btn" data-target="discord">Discord</button>
            <button class="tab-btn" data-target="tvmenu-lib">TvMenu Lib <span class="tag free">FREE</span></button>
            <button class="tab-btn" data-target="tvmenu-pcvr">TvMenuPCVR <span class="tag paid">PAID</span></button>
            <button class="tab-btn" data-target="modded-gtag">Modded Gtag By Tvman <span class="tag paid">PAID</span></button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
